name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.pages_artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run dashboard regression tests
        run: |
          npm run test:dashboard
          npm run test:research-operator

      - name: Validate multilingual specialty content
        run: npm run test:specialty-content

      - name: Validate participation map and offline research storage
        run: |
          npm run test:map
          npm run test:portal-data
          npm run test:mobile
          npm run test:icons

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Check responsive flows and offline synchronization
        env:
          # Synthetic host: every request is intercepted by the browser suite.
          VITE_SUPABASE_URL: https://browser-fixture.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_browser_fixture
        run: npm run test:browser

      - name: Check offline shell and private cache isolation
        run: npm run test:pwa

      - name: Build app
        env:
          # Both values are intentionally public and are embedded in the browser bundle.
          VITE_SUPABASE_URL: https://txrvbkdcfyhatauovngh.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CY8ztOkxrRvG07AhotvW1w_xr9FvXja
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Missing VITE_SUPABASE_URL GitHub secret"
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing VITE_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          npm run lint
          npm run typecheck
          npm run build

      # Full reruns must not upload another artifact with the same name.
      # Pass the build's name to deploy: its run_attempt may differ on a retry.
      - name: Choose Pages artifact name
        id: pages_artifact
        run: echo "name=github-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.pages_artifact.outputs.name }}
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check build artifact reference
        env:
          PAGES_ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          if [ -z "$PAGES_ARTIFACT_NAME" ]; then
            echo "::error::Missing build artifact name. Re-run all jobs to rebuild the Pages artifact."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
